name: Build and deploy to GitHub Pages

# Publishes dist/ to GitHub Pages. Required one-time setup in the repository:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# While the site is previewed as a GitHub Pages project site it is served from
# /isco-website/, so SITE_BASE below is set to that prefix. Once the custom
# domain www.iscogmbh.com serves the site from the root, change it to "/".
# src/App.tsx reads the same value through import.meta.env.BASE_URL, so the
# router base and the asset paths always agree.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  SITE_BASE: /

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the build output
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
